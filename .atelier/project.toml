schema_version = 1

[project]
display_name = "Atelier"
use_beads = true
summary = "the Beads Web project — the manager's own board screen and its server, a Next.js front end over a Rust back end"

[git]
completed_work_branch = "main"
agents_may_merge_completed_work = true
protected_branches = ["main"]

[beads]
issue_id_prefix = "bw"
work_areas = [
    "board",
    "screen",
    "server",
    "storage",
    "reports",
    "packaging",
    "interface",
    "tests",
    "tooling",
    "docs",
    "gates",
    "steps",
    "craft",
]

[verification]
visual_proof_for_ui_changes = true

[[verification.commands]]
name = "Project checks"
command = "npm test && (cd server && cargo test)"

[review]
external_review = "agent_decides"
evidence_requirements = "drive the running screen in a browser and read the result off a screenshot; a passing unit test is not a verified change"

[development]
setup_command = "npm install"
start_command = "npm run dev"
build_command = "npm run build"

[deployment]
command = ""
requires_confirmation = true

[cross_project]
delivery_projects = ["corsetta"]
