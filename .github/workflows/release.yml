name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g., v1.0.0)'
        required: true
        type: string

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: atelier-darwin-arm64
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact: atelier-darwin-x64
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: atelier-linux-x64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: atelier-win-x64

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build server
        run: cargo build --release --target ${{ matrix.target }}
        working-directory: server

      # Each release archive carries the program and a checked Node 24.20.0
      # runtime side by side, so the machine that unpacks it needs no Node of its
      # own for the Chat tab (bw-oesd.2).
      - name: Bundle archive (Unix)
        if: runner.os != 'Windows'
        run: |
          bash scripts/bundle-node.sh \
            --target "${{ matrix.target }}" \
            --binary "server/target/${{ matrix.target }}/release/atelier" \
            --out "${{ matrix.artifact }}.tar.gz"

      - name: Bundle archive (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $node = 'v24.20.0'
          $base = "node-$node-win-x64"
          Invoke-WebRequest -Uri "https://nodejs.org/dist/$node/$base.zip" -OutFile node.zip
          Invoke-WebRequest -Uri "https://nodejs.org/dist/$node/SHASUMS256.txt" -OutFile SHASUMS256.txt
          $want = ((Select-String -Path SHASUMS256.txt -Pattern "  $base.zip$").Line -split '\s+')[0]
          $got = (Get-FileHash node.zip -Algorithm SHA256).Hash.ToLower()
          if ($got -ne $want) { throw "node zip does not match Node's published fingerprint" }
          Expand-Archive node.zip -DestinationPath nodedir
          New-Item -ItemType Directory -Force -Path stage | Out-Null
          Copy-Item "server/target/${{ matrix.target }}/release/atelier.exe" stage/atelier.exe
          Copy-Item "nodedir/$base/node.exe" stage/node.exe
          Compress-Archive -Path stage/* -DestinationPath "${{ matrix.artifact }}.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}.*

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v7
        with:
          path: artifacts

      - name: Prepare release assets
        run: |
          mkdir -p release
          find artifacts -type f -exec mv {} release/ \;
          ls -la release/

      - name: Generate checksums
        run: |
          cd release
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          name: ${{ inputs.version || github.ref_name }}
          tag_name: ${{ inputs.version || github.ref_name }}
          files: release/*
          generate_release_notes: true

      # The Homebrew formula is written from the template in this repository,
      # so the tag's own tree has to be on disk beside the built files.
      - name: Checkout this tag for the Homebrew template
        uses: actions/checkout@v5
        with:
          path: repo

      - name: Update Homebrew formula
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${TAP_TOKEN:-}" ]; then
            echo "HOMEBREW_TAP_TOKEN not set — skipping Homebrew update"
            exit 0
          fi
          TAG="${{ inputs.version || github.ref_name }}"
          VERSION="${TAG#v}"
          ARM=$(sha256sum release/atelier-darwin-arm64.tar.gz | cut -d' ' -f1)
          INTEL=$(sha256sum release/atelier-darwin-x64.tar.gz | cut -d' ' -f1)
          LINUX=$(sha256sum release/atelier-linux-x64.tar.gz | cut -d' ' -f1)
          git clone --depth 1 "https://x-access-token:${TAP_TOKEN}@github.com/AhsanSarwar45/homebrew-atelier.git" tap
          mkdir -p tap/Formula
          sed -e "s|__VERSION__|${VERSION}|g" \
              -e "s|__ARM_SHA__|${ARM}|g" \
              -e "s|__INTEL_SHA__|${INTEL}|g" \
              -e "s|__LINUX_SHA__|${LINUX}|g" \
              repo/packaging/homebrew/atelier.rb.tmpl > tap/Formula/atelier.rb
          cd tap
          git add Formula/atelier.rb
          if git diff --cached --quiet; then
            echo "Homebrew formula already up to date"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "atelier ${VERSION}"
          git push origin HEAD:main
