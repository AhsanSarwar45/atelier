name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g., v1.0.0)'
        required: true
        type: string

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: atelier-darwin-arm64
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact: atelier-darwin-x64
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: atelier-linux-x64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: atelier-win-x64.exe

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build server
        run: cargo build --release --target ${{ matrix.target }}
        working-directory: server

      - name: Copy binary (Unix)
        if: runner.os != 'Windows'
        run: cp server/target/${{ matrix.target }}/release/atelier ${{ matrix.artifact }}

      - name: Copy binary (Windows)
        if: runner.os == 'Windows'
        run: copy server\target\${{ matrix.target }}\release\atelier.exe ${{ matrix.artifact }}

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v7
        with:
          path: artifacts

      - name: Prepare release assets
        run: |
          mkdir -p release
          find artifacts -type f -exec mv {} release/ \;
          ls -la release/

      - name: Generate checksums
        run: |
          cd release
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          name: ${{ inputs.version || github.ref_name }}
          tag_name: ${{ inputs.version || github.ref_name }}
          files: release/*
          generate_release_notes: true

      # The Scoop bucket is served straight out of this repository, so it is
      # the one manifest that has to carry a real version — and this step is
      # what puts one there, from the release that just published. It ships
      # holding placeholders so it can never name a download that does not
      # exist, which is what it used to do (bw-8um.3.15).
      - name: Checkout main for the Scoop manifest
        uses: actions/checkout@v5
        with:
          ref: main
          path: repo
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Fill the Scoop manifest from this release
        run: |
          set -euo pipefail
          TAG="${{ inputs.version || github.ref_name }}"
          VERSION="${TAG#v}"
          HASH="$(sha256sum release/atelier-win-x64.exe | cut -d' ' -f1)"
          cd repo
          jq --arg v "$VERSION" --arg h "$HASH" --arg tag "$TAG" \
            '.version = $v
             | .architecture."64bit".url = "https://github.com/ahsanswr/atelier/releases/download/" + $tag + "/atelier-win-x64.exe#/atelier.exe"
             | .architecture."64bit".hash = $h' \
            bucket/atelier.json > bucket/atelier.json.tmp
          mv bucket/atelier.json.tmp bucket/atelier.json
          if git diff --quiet -- bucket/atelier.json; then
            echo "The Scoop manifest already names this release"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bucket/atelier.json
          git commit -m "chore(scoop): name the download $TAG published"
          git push origin main

      - name: Update Homebrew formula
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${TAP_TOKEN:-}" ]; then
            echo "HOMEBREW_TAP_TOKEN not set — skipping Homebrew update"
            exit 0
          fi
          TAG="${{ inputs.version || github.ref_name }}"
          VERSION="${TAG#v}"
          ARM=$(sha256sum release/atelier-darwin-arm64 | cut -d' ' -f1)
          INTEL=$(sha256sum release/atelier-darwin-x64 | cut -d' ' -f1)
          LINUX=$(sha256sum release/atelier-linux-x64 | cut -d' ' -f1)
          git clone --depth 1 "https://x-access-token:${TAP_TOKEN}@github.com/ahsanswr/homebrew-atelier.git" tap
          mkdir -p tap/Formula
          sed -e "s|__VERSION__|${VERSION}|g" \
              -e "s|__ARM_SHA__|${ARM}|g" \
              -e "s|__INTEL_SHA__|${INTEL}|g" \
              -e "s|__LINUX_SHA__|${LINUX}|g" \
              repo/packaging/homebrew/atelier.rb.tmpl > tap/Formula/atelier.rb
          cd tap
          git add Formula/atelier.rb
          if git diff --cached --quiet; then
            echo "Homebrew formula already up to date"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "atelier ${VERSION}"
          git push origin HEAD:main

  # `wingetcreate update` only works AFTER the package already exists in
  # microsoft/winget-pkgs, and it builds the manifest it submits from the
  # download address alone — it never reads the files under `packaging/winget`.
  # Those ship holding placeholders so they can never name a download that does
  # not exist (bw-8um.3.15). The first submission is a one-time manual step, and
  # it is where they get filled in, from a release that has already published:
  #   sed -i -e "s|__VERSION__|<version>|g" -e "s|__HASH__|<sha256, upper case>|g" packaging/winget/*.yaml
  #   wingetcreate submit packaging/winget --token <PAT>
  # This job no-ops when WINGET_TOKEN is absent.
  winget:
    needs: release
    runs-on: windows-latest
    steps:
      - name: Submit winget manifest
        shell: pwsh
        env:
          WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}
        run: |
          if (-not $env:WINGET_TOKEN) {
            Write-Host "WINGET_TOKEN not set — skipping winget submission"
            exit 0
          }
          $tag = "${{ inputs.version || github.ref_name }}"
          $version = $tag.TrimStart('v')
          $url = "https://github.com/ahsanswr/atelier/releases/download/$tag/atelier-win-x64.exe"
          Invoke-WebRequest -Uri https://aka.ms/wingetcreate/latest -OutFile wingetcreate.exe
          .\wingetcreate.exe update weselow.atelier --version $version --urls $url --submit --token $env:WINGET_TOKEN
