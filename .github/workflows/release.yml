name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g., v1.0.0)'
        required: true
        type: string

jobs:
  build:
    permissions:
      contents: read
      actions: read
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: atelier-linux-x64

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # actions/cache is tag-scoped. Download build outputs from the previous
      # successful Release run so v0.x can reuse work done for v0.x-1.
      - name: Find previous release cache
        id: previous-cache
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET: ${{ matrix.target }}
        run: |
          echo "name=release-cache-v1-${ImageOS}-${TARGET}" >> "$GITHUB_OUTPUT"
          previous=$(gh run list -R "$GITHUB_REPOSITORY" --workflow release.yml --status success --limit 1 --json databaseId --jq '.[0].databaseId // empty')
          echo "run=$previous" >> "$GITHUB_OUTPUT"

      - name: Download previous release cache
        id: cache-download
        if: steps.previous-cache.outputs.run != ''
        continue-on-error: true
        uses: actions/download-artifact@v7
        with:
          name: ${{ steps.previous-cache.outputs.name }}
          run-id: ${{ steps.previous-cache.outputs.run }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/release-cache

      - name: Restore build outputs
        if: steps.cache-download.outcome == 'success'
        continue-on-error: true
        run: bash scripts/release-cache.sh restore "${{ runner.temp }}/release-cache"

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install frontend dependencies
        run: npm ci

      - name: Setup Bun build compiler
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.13'

      - name: Build frontend
        run: npm run build

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build server
        run: cargo build --release --locked --target ${{ matrix.target }}
        working-directory: server

      - name: Reuse published adapter bundle
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET: ${{ matrix.target }}
          ARTIFACT: ${{ matrix.artifact }}
        run: |
          output="server/target/$TARGET/release/atelier-adapters"
          if node scripts/build-acp-adapters.mjs "$TARGET" "$output" --cache-only; then
            exit 0
          fi
          mkdir -p "$RUNNER_TEMP/published-adapters" "$(dirname "$output")"
          gh release download -R "$GITHUB_REPOSITORY" -p "$ARTIFACT.tar.gz" -p SHA256SUMS.txt -D "$RUNNER_TEMP/published-adapters"
          (cd "$RUNNER_TEMP/published-adapters" && sha256sum -c SHA256SUMS.txt --ignore-missing)
          tar -xzf "$RUNNER_TEMP/published-adapters/$ARTIFACT.tar.gz" -C "$(dirname "$output")" atelier-adapters
          # The build step always validates the builder fingerprint and all
          # executable hashes, and rebuilds if the published bundle is stale.

      - name: Build pinned standalone ACP adapters
        run: node scripts/build-acp-adapters.mjs "${{ matrix.target }}" "server/target/${{ matrix.target }}/release/atelier-adapters"

      - name: Bundle Linux archive
        run: |
          tar -czf "${{ matrix.artifact }}.tar.gz" \
            -C "server/target/${{ matrix.target }}/release" atelier atelier-adapters

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}.*

      - name: Archive build cache
        id: cache-save
        continue-on-error: true
        run: bash scripts/release-cache.sh save "${{ runner.temp }}/release-cache"

      - name: Save cache for subsequent releases
        if: steps.cache-save.outcome == 'success' && steps.previous-cache.outputs.name != ''
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.previous-cache.outputs.name }}
          path: ${{ runner.temp }}/release-cache/*.tar.gz
          compression-level: 0
          retention-days: 14

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download Linux release package
        uses: actions/download-artifact@v7
        with:
          name: atelier-linux-x64
          path: artifacts

      - name: Prepare release assets
        run: |
          mkdir -p release
          find artifacts -type f -exec mv {} release/ \;
          ls -la release/

      - name: Generate checksums
        run: |
          cd release
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          name: ${{ inputs.version || github.ref_name }}
          tag_name: ${{ inputs.version || github.ref_name }}
          files: release/*
          generate_release_notes: true

      # The Homebrew formula is written from the template in this repository,
      # so the tag's own tree has to be on disk beside the built files.
      - name: Checkout this tag for the Homebrew template
        uses: actions/checkout@v5
        with:
          path: repo

      - name: Update Homebrew formula
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${TAP_TOKEN:-}" ]; then
            echo "HOMEBREW_TAP_TOKEN not set — skipping Homebrew update"
            exit 0
          fi
          TAG="${{ inputs.version || github.ref_name }}"
          VERSION="${TAG#v}"
          LINUX=$(sha256sum release/atelier-linux-x64.tar.gz | cut -d' ' -f1)
          git clone --depth 1 "https://x-access-token:${TAP_TOKEN}@github.com/AhsanSarwar45/homebrew-atelier.git" tap
          mkdir -p tap/Formula
          sed -e "s|__VERSION__|${VERSION}|g" \
              -e "s|__LINUX_SHA__|${LINUX}|g" \
              repo/packaging/homebrew/atelier.rb.tmpl > tap/Formula/atelier.rb
          cd tap
          git add Formula/atelier.rb
          if git diff --cached --quiet; then
            echo "Homebrew formula already up to date"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "atelier ${VERSION}"
          git push origin HEAD:main
