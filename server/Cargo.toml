[package]
name = "atelier"
version = "0.16.0"
edition = "2021"

# The command a person types. One name, from `src/identity.rs`.
[[bin]]
name = "atelier"
path = "src/main.rs"

[dependencies]
axum = { version = "0.7", features = ["ws"] }
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.5", features = ["cors", "fs"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = "0.3"
rust-embed = { version = "8", features = ["include-exclude", "debug-embed"] }
open = "5"
mime_guess = "2"
notify = "6"
tokio-stream = "0.1"
futures = "0.3"
rusqlite = { version = "0.31", features = ["bundled"] }
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "1"
directories = "5"
serde_yaml = "0.9"
mysql_async = "0.34"
reqwest = { version = "0.12", features = ["json", "rustls-tls", "stream"], default-features = false }

[dev-dependencies]
tempfile = "3"
# The browser's end of the one connection, so the case that proves the route
# speaks to it speaks the same protocol the browser does.
tokio-tungstenite = "0.24"
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
