[package]
name = "atelier"
version = "0.22.4"
edition = "2021"
license = "MIT"

# The command a person types. One name, from `src/identity.rs`.
[[bin]]
name = "atelier"
path = "src/main.rs"

[dependencies]
axum = { version = "0.7", features = ["ws"] }
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.5", features = ["cors", "fs"] }
serde = { version = "1", features = ["derive"] }
# `preserve_order` keeps a settings object's keys in the order they were written,
# so the session-context hook `personal.rs` merges into a provider's settings is
# written back the way `machinery/join` (a Python dict) wrote it, not alphabetised.
serde_json = { version = "1", features = ["preserve_order"] }
# Reads the project registry (`projects.toml`) natively, so the mode lookup in
# `rules.rs` no longer shells out to `machinery/join --mode`.
toml = "0.8"
tracing = "0.1"
tracing-subscriber = "0.3"
rust-embed = { version = "8", features = ["include-exclude", "debug-embed"] }
open = "5"
mime_guess = "2"
# Git's own ignore rules, read the way git reads them. Two callers: one level
# of a directory for the file browser's tree (`routes/fs.rs`), where
# `parents(true)` is what makes a .gitignore further up the tree count for the
# directory being listed; and the folder watch (`routes/fs_watch.rs`), which
# must not redraw that tree for every file a build writes.
ignore = "0.4"
# Range responses for `/api/fs/media`, so a <video> can seek. Safari will not
# play a source that answers a Range request with 200 and the whole file.
axum-range = "0.4"
# `TypedHeader<Range>`, which `axum-range` takes. 0.9 is the line that goes
# with axum 0.7; axum-extra 0.10 and later are for axum 0.8.
axum-extra = { version = "0.9", features = ["typed-header"] }
notify = "6"
tokio-stream = "0.1"
futures = "0.3"
# The official ACP SDK. Stable v1 remains the default wire contract; compile
# draft-v2 types for the audited future upgrade; today's published adapters
# negotiate v1 and the release build fails if that changes unexpectedly.
agent-client-protocol = { version = "=2.0.0", features = ["unstable_protocol_v2", "unstable_end_turn_token_usage", "unstable_elicitation", "unstable_session_fork"] }
# Directly speaks Chromium's DevTools WebSocket protocol without Playwright.
tokio-tungstenite = "0.24"
rusqlite = { version = "0.31", features = ["bundled"] }
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "1"
directories = "5"
serde_yaml = "0.9"
mysql_async = "0.34"
reqwest = { version = "0.12", features = ["json", "rustls-tls", "stream"], default-features = false }
base64 = "0.22"
flate2 = "1"
tar = "0.4"
zip = { version = "2", default-features = false, features = ["deflate"] }
# The fingerprints a release publishes for its own files, checked before
# anything downloaded is kept (`src/published.rs`).
sha2 = "0.10"
portable-pty = "0.9"
libc = "0.2"
# Objective screen-check comparison and diff encoding without pngjs/pixelmatch.
png = "0.18"
# The askpass helper a remote git call hands ssh lives in a directory of its
# own for the length of that one call (`routes/git.rs`), so this is wanted by
# the server itself and not only by its tests.
tempfile = "3"
# Deleting from the file browser puts things in the DESKTOP's trash rather
# than unlinking them (bw-5gax.3). It is the one call in the app that cannot be
# undone from inside it, and every machine already has the place for "removed,
# but not yet destroyed" — the freedesktop spec on Linux, the Finder's on macOS,
# the recycle bin on Windows. On Linux it is implemented natively and pulls in
# only `log`, `once_cell`, `scopeguard` and `urlencoding` beyond what is already
# here: no dbus, no gio.
trash = "5"

[dev-dependencies]
# `test-util` gives the tests a pausable clock, so the supervisor's growing
# backoff can be watched go by without the wall-clock waits it names.
tokio = { version = "1", features = ["test-util"] }
# Drives a router in-process, so the guard over the terminal can be proved
# without binding a port on a machine that may be running the real app.
tower = { version = "0.4", features = ["util"] }
# A whole HTTP connection over a pipe rather than a socket. `tower`'s `oneshot`
# calls the router as a function and so can never upgrade one: the extension
# that hands a request its side of the connection is put there by hyper when a
# real connection carried it, and a call that skipped the connection has no such
# thing. These two give the tests a connection with no port under it.
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
