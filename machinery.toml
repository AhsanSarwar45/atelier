# What this project answers when the shared machinery asks it something.
# This one IS the machinery: it runs its own tools on itself, so a change to a
# gate is held to the same run of steps as a change to anything the gate judges.

name = "machinery"
prefix = "mch"
lands_on = "main"

# The manager's own project: an agent lands its work here without asking.
agent_merges = true
brand = "MACHINERY"

# The systems a card may belong to. `--area` accepts these and nothing else.
#
#   board    the tools a job is poured, worked and closed with
#   gates    what refuses a bad close, a silent question, a commit with no card
#   steps    the run a job walks, and the review by someone who did not write it
#   craft    the worker definitions, the skills, the commands, the house voice
#   quality  the code-quality engine every project is measured by
#   tests    this machinery's own suite
#   docs     this machinery's own documents
areas = ["board", "gates", "steps", "craft", "quality", "tests", "docs"]

# A change here reaches every project that runs it, and one of them holds the
# report tools.
lands_elsewhere = ["corsetta", "beads-web"]

# This project's own quality tables. It has none yet: it is measured by the
# shared measures alone until it declares its own.
rules = ""

# A gate, a step and a bar are places anyone can go and look at as much as a
# file is: "the close gate" and "the prove step" are somewhere, not jargon.
places = ["\\b(?:the )?(?:close|stop|merge|status|report|helper|plan|habit|actor|push|prime|touch|fence|completion) gate\\b",
          "\\b(?:the )?(?:worktree|clarify|prove|ground|design|work|verify|benchmark|test|review|record|land) step\\b"]

[review]
persona = "the shared machinery — the board tools, the session gates and the run of steps that every project of this manager's runs in place, out of one home"
proves = "run the machinery's own suite against every registered project in turn and show the case that goes red without the change; a suite that passes before and after proves nothing"
